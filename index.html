<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para mi princesa Dayra 💜❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #5a189a, #b00020);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

.container {
    z-index: 2;
    padding: 20px;
}

h1 {
    font-size: 2.8em;
}

button {
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #e0e0e0;
    color: black;
    position: absolute;
}

.message {
    font-size: 1.5em;
    margin-top: 15px;
    animation: fade 1s;
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.heart {
    position: absolute;
    animation: float 6s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

.teamo {
    position: absolute;
    font-size: 1.3em;
    animation: pop 2s forwards;
}

@keyframes pop {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.8); }
}
</style>
</head>

<body>

<div class="container" id="content">
    <h1>Dayra, mi princesa 💜❤️</h1>
    <h1>¿Quieres ser mi San Valentín mi amorcito? 💘</h1>
    <button id="yes">Sí 💕</button>
    <button id="no">No 🙈</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const content = document.getElementById("content");

noBtn.addEventListener("mouseover", () => {
    noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
});

yesBtn.addEventListener("click", () => {
    content.innerHTML = `
        <h1>Gracias por decir que sí,mas te vale JAJAJA 💜</h1>
        <div class="message">Eres la razón de muchas de mis sonrisas ✨</div>
        <div class="message">Tu presencia hace mis días más bonitos 💕</div>
        <div class="message">Prometo cuidarte y estar para ti siempre, Pinky Promise 🥹</div>
        <div class="message">Feliz San Valentín, mi princesa, aunque CONTIGO TODOS LOS DIAS SON SAN VALENTIN, TE AMOOOOOOOOOOO MUCHO MUCHOTE MI AMORCITO HERMOSA 💜❤️</div>
    `;
});

document.body.addEventListener("click", (e) => {
    const text = document.createElement("div");
    text.className = "teamo";
    text.innerText = "Te amo 💜";
    text.style.left = e.clientX + "px";
    text.style.top = e.clientY + "px";
    document.body.appendChild(text);

    setTimeout(() => text.remove(), 2000);
});

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = Math.random() > 0.5 ? "💜" : "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 25 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
